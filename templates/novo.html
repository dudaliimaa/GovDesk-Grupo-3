{% extends "base.html" %}

{% block content %}
    <h2 style="color:#1E2761;">Novo chamado</h2>
    {% if erro %}
    <p style="background:#fdecea; color:#8a1f17; padding:10px 14px; border-radius:6px;">{{ erro }}</p>
    {% endif %}
    <form method="post" style="display:grid; gap:14px; max-width:520px;">
        <label>Título *
            <input type="text" name="titulo" value="{{ dados.get('titulo', '') }}" style="width:100%; padding:8px;">
        </label>
        <label>Descrição
            <textarea name="descricao" rows="4" style="width:100%; padding:8px;">{{ dados.get('descricao', '') }}</textarea>
            <small style="color:#6B7280;">
            Aviso de privacidade: não informe dados pessoais sensíveis (saúde, religião, etc.) neste campo.
            </small>
        </label>
        <label>Solicitante *
            <input type="text" name="solicitante" value="{{ dados.get('solicitante', '') }}" style="width:100%; padding:8px;">
        </label>
        <label>Prioridade
            <select name="prioridade" style="padding:8px;">
                {% for p in prioridades %}
                <option value="{{ p }}" {% if dados.get('prioridade', 'média') == p %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
        </label>

        <button type="submit" style="background:#1E2761; color:white; border:0; padding:10px 16px; border-radius:6px; cursor:pointer;">
            Abrir chamado
        </button>
    </form>
{% endblock %}
