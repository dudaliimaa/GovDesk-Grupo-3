{% extends "base.html" %}
{% block content %}
<section class="page-heading" style="max-width: 650px; width: 100%; margin: 0 auto 20px auto;">
  <div>
    <h2>Novo chamado</h2>
    <p class="page-description">
      Preencha as informações para registrar uma solicitação de suporte.
    </p>
  </div>
</section>
<section class="card form-card" style="max-width: 650px; width: 100%; margin: 0 auto; box-sizing: border-box;">
  {% if erro %}
    <p class="error-message" role="alert">
      {{ erro }}
    </p>
  {% endif %}
  <form method="post" class="form-grid">
    <label for="titulo">
      Título *
      <input
        id="titulo"
        type="text"
        name="titulo"
        value="{{ dados.get('titulo', '') }}"
        required
      >
    </label>
    <label for="descricao">
      Descrição
      <textarea
        id="descricao"
        name="descricao"
        rows="4"
      >{{ dados.get('descricao', '') }}</textarea>
      <span class="field-help">
        Descreva o problema ou a necessidade de suporte.
      </span>
      <span class="field-help">
        Aviso de privacidade: não informe dados pessoais sensíveis,
        como informações de saúde ou religião, neste campo.
      </span>
    </label>
    <label for="solicitante">
      Solicitante *
      <input
        id="solicitante"
        type="text"
        name="solicitante"
        value="{{ dados.get('solicitante', '') }}"
        required
      >
    </label>
    <label for="prioridade">
      Prioridade
      <select id="prioridade" name="prioridade">
        {% for p in prioridades %}
          <option
            value="{{ p }}"
            {% if dados.get('prioridade', 'média') == p %}selected{% endif %}
          >
            {{ p|capitalize }}
          </option>
        {% endfor %}
      </select>
    </label>
    <div class="form-actions">
      <button class="button" type="submit">
        Abrir chamado
      </button>
      <a class="button button-secondary" href="/">
        Cancelar
      </a>
    </div>
  </form>
</section>
{% endblock %}
