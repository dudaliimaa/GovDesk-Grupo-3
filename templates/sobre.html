{% extends "base.html" %}
{% block content %}

  <table>
    <tr>
      <th>Integrante</th>
      <th>Papel</th>
    </tr>
    {% for pessoa in equipe %}

      <td>{{ pessoa.papel }}</td>

  <p style="margin-top:24px; color:#6B7280; font-size:13px;">
    ITI004 — Gestão e Governança de TI · Projeto GovDesk
  </p>
{% endblock %}
